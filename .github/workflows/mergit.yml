name: Mergit

on:
  push:
    branches:
      - master
  workflow_run:
    workflows: ["*"]
    types:
      - completed

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write

jobs:
  mergit:
    runs-on: ubuntu-latest
    steps:
      - uses: odiseo159-beep/mergit@v1
        with:
          agent-key: ${{ secrets.MERGIT_AGENT_KEY }}
