name: Mergit

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to settle"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: mergit-settle

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: odiseo159-beep/mergit@v1
        with:
          agent-key: ${{ secrets.MERGIT_AGENT_KEY }}
